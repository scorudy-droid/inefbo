<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contador ASP Clásico</title>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; margin-top: 100px; background-color: #f4f7f6; }
        .contenedor { background: white; padding: 30px; display: inline-block; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .numero { font-size: 64px; color: #e74c3c; font-weight: bold; margin: 20px 0; }
        button { padding: 10px 20px; font-size: 16px; cursor: pointer; background-color: #3498db; color: white; border: none; border-radius: 4px; }
        button:hover { background-color: #2980b9; }
    </style>
</head>
<body>

    <div class="contenedor">
        <h2>Visitas / Cargas de la página</h2>
        <!-- Aquí se inyecta el número del TXT -->
        <div id="contador-visitas" class="numero">...</div>
        <p>El servidor ASP sumó +1 y lo guardó en el archivo TXT.</p>
        <button onclick="location.reload()">Recargar Página</button>
    </div>

    <script>
        // Se ejecuta automáticamente al cargar o recargar la página
        window.onload = function() {
            fetch('contador.asp')
                .then(response => {
                    if (!response.ok) throw new Error("Error en el servidor ASP");
                    return response.text();
                })
                .then(valorActualizado => {
                    // Coloca el número devuelto por el ASP en el DIV
                    document.getElementById('contador-visitas').innerText = valorActualizado;
                })
                .catch(error => {
                    console.error("Error:", error);
                    document.getElementById('contador-visitas').innerText = "❌";
                });
        };
    </script>

</body>
</html>
