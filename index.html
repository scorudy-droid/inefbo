<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sitio No Disponible</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f8f9fa;
            color: #343a40;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            text-align: center;
            padding: 20px;
        }
        .container {
            max-width: 500px;
        }
        h1 {
            font-size: 2.5rem;
            margin-bottom: 1rem;
            color: #dc3545;
        }
        p {
            font-size: 1.2rem;
            color: #6c757d;
            line-height: 1.5;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Lo sentimos</h1>
        <p>Este sitio web o servicio no está disponible en este momento. Por favor, vuelve a intentarlo más tarde.</p>
    </div>

</body>
</html>
